[project]
name = "athleteiq"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115", "uvicorn[standard]>=0.30", "pydantic>=2.8", "pydantic-settings>=2.4",
  "sqlalchemy>=2.0.32", "alembic>=1.13", "psycopg[binary]>=3.2",
  "polars>=1.5", "numpy>=2.0", "scipy>=1.14", "statsmodels>=0.14",
  "fitdecode>=0.10", "gpxpy>=1.6", "lxml>=5.3", "python-multipart>=0.0.9",
  "dramatiq[redis]>=1.17", "redis>=5.0", "boto3>=1.35", "httpx>=0.27", "google-genai>=1.0",
]
[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5"]
[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"
[tool.setuptools.packages.find]
include = ["athleteiq*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
